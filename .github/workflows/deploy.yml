name: Deploy Level 2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 192.168.1.12
          username: raff
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/level1
            git pull origin main
